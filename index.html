<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Focus Timer • Stay Productive</title>
  <meta name="description" content="A clean, minimal timer for focused work sessions and question-based timing">
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a212a;
      --muted: #8b9bab;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --success: #10b981;
      --warning: #f59e0b;
      --glass: rgba(255,255,255,0.03);
      --radius: 12px;
    }
    
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #0a0f14 100%);
      color: #e6eef3;
      line-height: 1.6;
    }
    
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    
    .card {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(160deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.01) 100%);
      border-radius: var(--radius);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 
        0 20px 40px rgba(2,6,23,0.4),
        0 0 0 1px rgba(255,255,255,0.02);
      backdrop-filter: blur(10px);
    }
    
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .logo {
      width: 52px;
      height: 52px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #021018;
      box-shadow: 0 4px 15px rgba(124,92,255,0.3);
    }
    
    .header-text {
      flex: 1;
      min-width: 200px;
    }
    
    h1 {
      font-size: 24px;
      margin: 0 0 4px 0;
      background: linear-gradient(135deg, #fff, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p.lead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 500px;
    }
    
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    
    .field {
      background: var(--panel);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.03);
      transition: all 0.2s ease;
    }
    
    .field:focus-within {
      border-color: rgba(124,92,255,0.3);
      box-shadow: 0 0 0 2px rgba(124,92,255,0.1);
    }
    
    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: rgba(0,0,0,0.2);
      color: inherit;
      font-size: 16px;
      font-weight: 600;
      -moz-appearance: textfield;
      appearance: textfield;
      transition: all 0.2s ease;
    }
    
    input:focus {
      outline: none;
      background: rgba(0,0,0,0.3);
    }
    
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .main-timer {
      display: flex;
      gap: 24px;
      margin: 24px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .timebox {
      flex: 1;
      min-width: 240px;
      background: var(--glass);
      padding: 24px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.03);
      transition: all 0.3s ease;
    }
    
    .timebox.active {
      border-color: rgba(124,92,255,0.3);
      box-shadow: 0 0 20px rgba(124,92,255,0.1);
    }
    
    .clock {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 8px 0;
      font-variant-numeric: tabular-nums;
    }
    
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
    }
    
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 16px;
      width: 100%;
      position: relative;
    }
    
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 240px;
    }
    
    .total-timebox {
      background: var(--glass);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.03);
    }
    
    .total-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.05);
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      color: inherit;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 80px;
    }
    
    button:hover {
      background: rgba(255,255,255,0.05);
      transform: translateY(-1px);
    }
    
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #021018;
      border: none;
      box-shadow: 0 4px 15px rgba(124,92,255,0.2);
    }
    
    button.primary:hover {
      box-shadow: 0 6px 20px rgba(124,92,255,0.3);
      transform: translateY(-2px);
    }
    
    button.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    button.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
    }
    
    .secondary-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .secondary-buttons button {
      flex: 1;
      min-width: 120px;
    }
    
    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    
    .status-dot.active {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    
    .status-dot.paused {
      background: var(--warning);
    }
    
    @media (max-width: 768px) {
      .card {
        padding: 20px;
      }
      
      .controls {
        grid-template-columns: 1fr;
      }
      
      .clock {
        font-size: 36px;
      }
      
      .main-timer {
        gap: 16px;
      }
      
      footer {
        flex-direction: column;
        text-align: center;
      }
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 16px;
      }
      
      header {
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }
      
      .buttons, .secondary-buttons {
        flex-direction: column;
      }
      
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">FT</div>
      <div class="header-text">
        <h1>Focus Timer</h1>
        <p class="lead">Stay consistent. Focus on each question without distraction. The timer adapts, you just solve.</p>
      </div>
    </header>

    <div class="controls">
      <div class="field">
        <label for="totalMins">Total test length (minutes)</label>
        <input id="totalMins" type="number" min="1" value="60">
      </div>
      <div class="field">
        <label for="qMins">Time per question (minutes)</label>
        <input id="qMins" type="number" min="0.5" step="0.5" value="2">
      </div>
      <div class="field">
        <label for="beepMs">Beep duration (ms)</label>
        <input id="beepMs" type="number" min="10" max="1000" value="120">
      </div>
    </div>

    <div class="main-timer">
      <div class="timebox active" id="questionTimebox">
        <div class="clock" id="qClock">02:00</div>
        <div class="sub">Question <span id="qNumber">1</span> • Time remaining</div>
        <div class="progress"><i id="qProg"></i></div>
      </div>

      <div class="controls-panel">
        <div class="total-timebox">
          <div class="total-label">Total remaining</div>
          <div class="clock" id="tClock">60:00</div>
          <div class="sub">Overall test timer</div>
          <div class="progress"><i id="tProg"></i></div>
        </div>

        <div class="buttons">
          <button id="startBtn" class="primary">Start</button>
          <button id="pauseBtn" class="ghost">Pause</button>
          <button id="resetBtn" class="ghost">Reset</button>
        </div>
        
        <div class="secondary-buttons">
          <button id="skipBtn" class="ghost">Skip Question</button>
          <button id="muteBtn" class="ghost">Mute Sound</button>
        </div>
      </div>
    </div>

    <footer>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready to start</span>
      </div>
      <div id="meta">Question time: 2.0m • Total: 60.0m</div>
    </footer>
  </div>

<script>
(() => {
  // DOM Elements
  const totalMins = document.getElementById('totalMins');
  const qMins = document.getElementById('qMins');
  const beepMs = document.getElementById('beepMs');
  const qClock = document.getElementById('qClock');
  const tClock = document.getElementById('tClock');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');
  const muteBtn = document.getElementById('muteBtn');
  const qNumber = document.getElementById('qNumber');
  const qProg = document.getElementById('qProg');
  const tProg = document.getElementById('tProg');
  const meta = document.getElementById('meta');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const questionTimebox = document.getElementById('questionTimebox');

  // State
  let totalSeconds = 60 * parseFloat(totalMins.value || 60);
  let perQuestion = Math.max(30, Math.round(parseFloat(qMins.value || 2) * 60)); // Minimum 30 seconds
  let remainingTotal = totalSeconds;
  let remainingQuestion = perQuestion;
  let qCount = 1;
  let running = false;
  let timerId = null;
  let muted = false;
  let audioCtx = null;

  // Initialize Audio Context
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Sound functions
  function beep(ms) {
    if (muted || !audioCtx) return;
    try {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + ms/1000);
      
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + ms/1000);
    } catch (e) {
      console.warn('Audio error:', e);
    }
  }

  function playEndSound() {
    if (muted || !audioCtx) return;
    try {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
      oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.5);
    } catch (e) {
      console.warn('Audio error:', e);
    }
  }

  // Format time as MM:SS
  function formatTime(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  // Update all displays
  function updateDisplays() {
    qClock.textContent = formatTime(remainingQuestion);
    tClock.textContent = formatTime(remainingTotal);
    qNumber.textContent = qCount;
    
    // Update progress bars
    const qPct = Math.min(100, Math.max(0, ((perQuestion - remainingQuestion) / perQuestion) * 100));
    const tPct = Math.min(100, Math.max(0, ((totalSeconds - remainingTotal) / totalSeconds) * 100));
    
    qProg.style.width = `${qPct}%`;
    tProg.style.width = `${tPct}%`;
    
    // Update meta info
    meta.textContent = `Question time: ${(perQuestion/60).toFixed(1)}m • Total: ${(totalSeconds/60).toFixed(1)}m`;
    
    // Update status
    if (running) {
      statusDot.className = 'status-dot active';
      statusText.textContent = 'Timer running';
    } else if (remainingTotal <= 0) {
      statusDot.className = 'status-dot';
      statusText.textContent = 'Completed';
    } else {
      statusDot.className = 'status-dot paused';
      statusText.textContent = 'Paused';
    }
  }

  // Sync values from inputs
  function syncValues() {
    totalSeconds = Math.max(60, Math.round(60 * parseFloat(totalMins.value || 60)));
    perQuestion = Math.max(30, Math.round(60 * parseFloat(qMins.value || 2)));
    
    if (!running) {
      remainingTotal = totalSeconds;
      remainingQuestion = perQuestion;
      qCount = 1;
    } else {
      remainingTotal = Math.min(remainingTotal, totalSeconds);
      remainingQuestion = Math.min(remainingQuestion, perQuestion);
    }
    
    updateDisplays();
  }

  // Timer functions
  function tick() {
    if (remainingTotal <= 0) {
      stop(true);
      return;
    }
    
    remainingTotal -= 1;
    remainingQuestion -= 1;
    
    if (remainingQuestion <= 0) {
      beep(Math.max(10, Math.min(1000, parseInt(beepMs.value || 120))));
      qCount += 1;
      remainingQuestion = Math.min(perQuestion, remainingTotal);
      
      if (remainingTotal <= 0) {
        stop(true);
        return;
      }
    }
    
    updateDisplays();
  }

  function start() {
    if (running) return;
    
    initAudio();
    if (remainingTotal <= 0) syncValues();
    
    running = true;
    timerId = setInterval(tick, 1000);
    
    startBtn.textContent = 'Running';
    startBtn.disabled = true;
    questionTimebox.classList.add('active');
    
    updateDisplays();
  }

  function pause() {
    if (!running) return;
    
    clearInterval(timerId);
    timerId = null;
    running = false;
    
    startBtn.textContent = 'Resume';
    startBtn.disabled = false;
    questionTimebox.classList.remove('active');
    
    updateDisplays();
  }

  function stop(playEnd = false) {
    pause();
    
    if (playEnd && !muted) {
      playEndSound();
    }
    
    remainingTotal = 0;
    remainingQuestion = 0;
    updateDisplays();
  }

  function reset() {
    pause();
    syncValues();
    startBtn.textContent = 'Start';
    startBtn.disabled = false;
    questionTimebox.classList.remove('active');
  }

  // Event listeners
  totalMins.addEventListener('change', syncValues);
  qMins.addEventListener('change', syncValues);
  
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  
  skipBtn.addEventListener('click', () => {
    if (remainingTotal <= 0 || !running) return;
    
    beep(Math.max(10, Math.min(1000, parseInt(beepMs.value || 120))));
    qCount += 1;
    remainingQuestion = Math.min(perQuestion, remainingTotal);
    updateDisplays();
  });
  
  muteBtn.addEventListener('click', () => { 
    muted = !muted; 
    muteBtn.textContent = muted ? 'Unmute Sound' : 'Mute Sound';
    
    // Initialize audio on first unmute
    if (!muted) initAudio();
  });

  // Initialize
  syncValues();
  updateDisplays();
  
  // Add click sound to buttons for better feedback
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!muted && audioCtx && running) {
        beep(30);
      }
    });
  });
})();
</script>
</body>
</html>
