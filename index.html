<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow • Immersive Focus Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Animation -->
  <div class="bg-animation"></div>
  
  <!-- Main Container -->
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">FF</div>
        <h1>FocusFlow</h1>
      </div>
      <div class="header-controls">
        <button id="settings-toggle" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Timer Section -->
    <main class="main-content">
      <div class="timer-section">
        <!-- Question Timer -->
        <div class="timer-container">
          <div class="timer-display">
            <div class="timer-label">Question <span id="qNumber">1</span></div>
            <div class="timer" id="qClock">02:00</div>
            <div class="progress-ring">
              <svg width="280" height="280" viewBox="0 0 280 280">
                <circle cx="140" cy="140" r="130" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="none"></circle>
                <circle id="qProgress" cx="140" cy="140" r="130" stroke="url(#gradient)" stroke-width="8" fill="none" 
                  stroke-dasharray="816.8" stroke-dashoffset="0" transform="rotate(-90 140 140)"></circle>
                <defs>
                  <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#7c5cff" />
                    <stop offset="100%" stop-color="#00d4ff" />
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>
        </div>

        <!-- Total Timer -->
        <div class="total-timer">
          <div class="timer-label">Total Time</div>
          <div class="timer" id="tClock">60:00</div>
          <div class="progress-bar">
            <div class="progress-fill" id="tProgress"></div>
          </div>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="controls">
        <div class="primary-controls">
          <button id="startBtn" class="btn btn-primary">
            <span class="btn-icon">▶</span>
            Start
          </button>
          <button id="pauseBtn" class="btn btn-secondary">
            <span class="btn-icon">⏸</span>
            Pause
          </button>
          <button id="resetBtn" class="btn btn-secondary">
            <span class="btn-icon">↺</span>
            Reset
          </button>
        </div>
        <div class="secondary-controls">
          <button id="skipBtn" class="btn btn-ghost">
            <span class="btn-icon">⏭</span>
            Skip
          </button>
          <button id="muteBtn" class="btn btn-ghost">
            <span class="btn-icon">🔊</span>
            Mute
          </button>
        </div>
      </div>
    </main>

    <!-- Settings Panel (Initially Hidden) -->
    <div id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-group">
          <label for="totalMins">Total Duration (minutes)</label>
          <input type="number" id="totalMins" min="1" value="60">
        </div>
        <div class="setting-group">
          <label for="qMins">Time Per Question (minutes)</label>
          <input type="number" id="qMins" min="0.5" step="0.5" value="2">
        </div>
        <div class="setting-group">
          <label for="beepMs">Beep Duration (ms)</label>
          <input type="number" id="beepMs" min="10" max="1000" value="120">
        </div>
        <div class="setting-group">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="blue">Ocean</option>
            <option value="purple">Purple</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="status-bar">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready to start</span>
      </div>
      <div class="session-info">
        <span id="sessionStats">Question: 2.0m • Total: 60.0m</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
