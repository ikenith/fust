<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Focus Timer</title>
  <style>
    :root{
      --bg:#0b0f13;
      --panel:#0f1720;
      --muted:#9aa6b2;
      --accent:#7c5cff;
      --accent-2:#00d4ff;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%;width:100%;}
    body{
      margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background:linear-gradient(180deg,var(--bg),#07090b 120%);
      color:#e6eef3;display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .card{
      width:100%;max-width:880px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.6);
    }
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
    .logo{width:48px;height:48px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#021018;}
    h1{font-size:18px;margin:0}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
    .field{background:var(--panel);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.02)}
    label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
    input[type=number], input[type=text]{width:100%;padding:10px;border-radius:8px;border:none;background:transparent;color:inherit;font-size:15px;-moz-appearance:textfield;appearance:textfield;}
    input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

    .big{display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap;justify-content:center}
    .timebox{flex:1;min-width:220px;background:var(--glass);padding:18px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .clock{font-size:44px;font-weight:700;letter-spacing:1px}
    .sub{color:var(--muted);font-size:13px;margin-top:6px;text-align:center}

    .buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    button{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;cursor:pointer;color:inherit;font-weight:600}
    button.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#021018;border:none;box-shadow:0 8px 24px rgba(124,92,255,0.12)}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04)}

    .progress{height:10px;background:rgba(255,255,255,0.04);border-radius:8px;overflow:hidden;margin-top:12px;width:100%}
    .progress > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

    footer{margin-top:16px;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:center}

    @media (max-width:720px){.controls{grid-template-columns:1fr}.clock{font-size:36px}}
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">FT</div>
      <div>
        <h1>Focus Timer</h1>
        <p class="lead">Stay consistent. Focus on each question without distraction. The timer adapts, you just solve.</p>
      </div>
    </header>

    <div class="controls">
      <div class="field">
        <label>Total test length (minutes)</label>
        <input id="totalMins" type="number" min="1" value="60">
      </div>
      <div class="field">
        <label>Time per question (minutes)</label>
        <input id="qMins" type="number" min="0" step="0.1" value="2">
      </div>
      <div class="field">
        <label>Short beep length (ms)</label>
        <input id="beepMs" type="number" min="10" value="120">
      </div>
    </div>

    <div class="big">
      <div class="timebox">
        <div class="clock" id="qClock">02:00</div>
        <div class="sub">Current question • <span id="qNumber">1</span></div>
        <div class="progress"><i id="qProg"></i></div>
      </div>

      <div style="width:220px;display:flex;flex-direction:column;gap:12px;">
        <div class="timebox" style="padding:14px;align-items:flex-start;">
          <div style="font-size:13px;color:var(--muted)">Total remaining</div>
          <div class="clock" id="tClock">60:00</div>
          <div class="sub">Overall test timer</div>
          <div class="progress"><i id="tProg"></i></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="buttons">
            <button id="startBtn" class="primary">Start</button>
            <button id="pauseBtn" class="ghost">Pause</button>
            <button id="resetBtn" class="ghost">Reset</button>
          </div>
          <label style="font-size:13px;color:var(--muted)">Options</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <button id="skipBtn" class="ghost">Skip Question</button>
            <button id="muteBtn" class="ghost">Mute</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div>Press <strong>Start</strong> to begin. Stay focused — one question at a time.</div>
      <div id="meta"></div>
    </footer>
  </div>

<script>
(() => {
  const totalMins = document.getElementById('totalMins');
  const qMins = document.getElementById('qMins');
  const beepMs = document.getElementById('beepMs');
  const qClock = document.getElementById('qClock');
  const tClock = document.getElementById('tClock');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');
  const muteBtn = document.getElementById('muteBtn');
  const qNumber = document.getElementById('qNumber');
  const qProg = document.getElementById('qProg');
  const tProg = document.getElementById('tProg');
  const meta = document.getElementById('meta');

  let totalSeconds = 60 * parseFloat(totalMins.value || 60);
  let perQuestion = Math.max(1, Math.round(parseFloat(qMins.value || 2) * 60));
  let remainingTotal = totalSeconds;
  let remainingQuestion = perQuestion;
  let qCount = 1;
  let running = false;
  let timerId = null;
  let muted = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(ms){
    if(muted) return;
    try{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.12;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      setTimeout(()=>{o.stop()}, ms);
    }catch(e){console.warn('Audio error', e)}
  }

  function formatTime(s){
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s/60); const sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function updateDisplays(){
    qClock.textContent = formatTime(remainingQuestion);
    tClock.textContent = formatTime(remainingTotal);
    qNumber.textContent = qCount;
    const qPct = ((perQuestion - remainingQuestion)/perQuestion)*100;
    qProg.style.width = Math.min(100, Math.max(0,qPct)) + '%';
    const tPct = ((totalSeconds - remainingTotal)/totalSeconds)*100;
    tProg.style.width = Math.min(100, Math.max(0,tPct)) + '%';
    meta.textContent = `Q time: ${Math.round(perQuestion/60*100)/100}m • Total: ${Math.round(totalSeconds/60*100)/100}m`;
  }

  function syncValues(){
    totalSeconds = Math.max(1, Math.round(60 * parseFloat(totalMins.value || 60)));
    perQuestion = Math.max(1, Math.round(60 * parseFloat(qMins.value || 2)));
    // If timer is running, adjust dynamically
    if(running){
      remainingTotal = Math.min(remainingTotal, totalSeconds);
      remainingQuestion = Math.min(remainingQuestion, perQuestion);
    } else {
      remainingTotal = totalSeconds;
      remainingQuestion = perQuestion;
      qCount = 1;
    }
    updateDisplays();
  }

  totalMins.addEventListener('change', syncValues);
  qMins.addEventListener('change', syncValues);

  function tick(){
    if(remainingTotal <= 0){ stop(true); return; }
    remainingTotal -= 1;
    remainingQuestion -= 1;
    if(remainingQuestion <= 0){
      beep(Math.max(10, parseInt(beepMs.value || 120)));
      qCount += 1;
      remainingQuestion = Math.min(perQuestion, remainingTotal);
      if(remainingTotal <= 0){ stop(true); return; }
    }
    updateDisplays();
  }

  function start(){
    if(running) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(remainingTotal <= 0){ syncValues(); }
    running = true;
    timerId = setInterval(tick, 1000);
    startBtn.textContent = 'Running'; startBtn.disabled = true;
  }
  function pause(){
    if(!running) return;
    clearInterval(timerId); timerId = null; running = false; startBtn.textContent = 'Start'; startBtn.disabled = false;
  }
  function stop(playEnd=false){
    pause();
    if(playEnd && !muted) beep(350);
    remainingTotal = 0; remainingQuestion = 0;
    updateDisplays();
    startBtn.textContent = 'Start'; startBtn.disabled = false;
  }
  function reset(){
    pause(); syncValues(); startBtn.textContent = 'Start'; startBtn.disabled = false;
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  skipBtn.addEventListener('click', ()=>{
    if(remainingTotal <= 0 || !running) return; // prevent skipping when stopped or ended
    beep(Math.max(10, parseInt(beepMs.value || 120)));
    qCount += 1;
    remainingQuestion = Math.min(perQuestion, remainingTotal);
    updateDisplays();
  });
  muteBtn.addEventListener('click', ()=>{ muted = !muted; muteBtn.textContent = muted ? 'Unmute' : 'Mute'; });

  syncValues();
  updateDisplays();
})();
</script>
</body>
</html>
